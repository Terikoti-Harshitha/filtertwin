version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: filtertwin-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filtertwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filtertwin_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-filtertwin_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filtertwin} -d ${POSTGRES_DB:-filtertwin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filtertwin-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-filtertwin}:${POSTGRES_PASSWORD:-filtertwin_secret_2026}@db:5432/${POSTGRES_DB:-filtertwin_db}
      - PROJECT_NAME=FilterTwin
      - VERSION=1.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: filtertwin-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
